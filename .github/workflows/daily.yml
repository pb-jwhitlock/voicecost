name: Daily price update + deploy

on:
  schedule:
    - cron: "0 10 * * *"     # 10:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # code changes: rebuild + deploy without refetching

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VOICECOST_URL: https://voicecost.net
  CHROME_PATH: /usr/bin/google-chrome
  TZ: America/New_York

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch pricing pages, extract, snapshot, diff
        if: github.event_name != 'push'
        run: python scripts/update.py
      - name: Build static site
        run: python scripts/build.py
      - name: Commit new snapshot data
        if: github.event_name != 'push'
        run: |
          git config user.name "voicecost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "data: daily snapshot $(date +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
